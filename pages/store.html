<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mr.Pizza | STORE</title>
    <meta name="description" content="미스터피자 리뉴얼 콘셉트 매장 정보를 확인할 수 있는 스토어 페이지입니다." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://your-domain.com/pages/store.html" />
    <meta name="theme-color" content="#ff0033" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mr.Pizza" />
    <meta property="og:title" content="Mr.Pizza | STORE" />
    <meta property="og:description" content="미스터피자 리뉴얼 콘셉트 스토어 페이지에서 매장 정보와 브랜드 공간 무드를 확인해보세요." />
    <meta property="og:image" content="https://oloklkl.github.io/mr-pizza/resources/images/component/common/meta.png" />
    <meta property="og:url" content="https://oloklkl.github.io/mr-pizza/pages/store.html" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mr.Pizza | STORE" />
    <meta name="twitter:description" content="미스터피자 리뉴얼 콘셉트 스토어 페이지에서 매장 정보와 브랜드 공간 무드를 확인해보세요." />
    <meta name="twitter:image" content="https://oloklkl.github.io/mr-pizza/resources/images/component/common/meta.png" />

    <!-- favicon -->
    <link rel="icon" href="../resources/images/favicon/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="../resources/images/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../resources/images/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="../resources/images/favicon/apple-touch-icon.png" />

    <!-- Google Fonts: Montserrat / Playfair Display -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Playfair+Display:wght@600;700&display=swap" />

    <!-- Pretendard (Variable) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" />
    <link rel="stylesheet" href="../resources/css/pattern_css.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.1/gsap.min.js"></script>
    <script defer src="../resources/js/include.js"></script>
    <script defer src="../resources/js/ui-pattern.js"></script>
    <script type="module" defer src="../resources/js/store-data.js"></script>
    <script type="module" defer src="../resources/js/store.js"></script>
  </head>
  <body>
    <div id="skip-nav">
      <a href="#gnb">메뉴 바로가기</a>
      <a href="#container">본문 바로가기</a>
    </div>
    <div id="wrap">
      <header id="header" include-html="./layout/header.html"></header>

      <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
        <div class="mobile-menu__content">
          <button class="mobile-menu__close" type="button" aria-label="Close menu">
            <span></span>
            <span></span>
          </button>

          <nav class="mobile-menu__nav">
            <ul>
              <li><a href="#">MENU</a></li>
              <li><a href="#">DROP</a></li>
              <li><a href="#">STORE</a></li>
              <li><a href="#">ABOUT</a></li>
            </ul>
          </nav>

          <div class="mobile-menu__utils" aria-label="Account and search">
            <a href="/mr-pizza/pages/cart/cart.html" class="mobile-menu__util" aria-label="Cart">
              <i data-lucide="shopping-bag" class="icon"></i>
              <span>CART</span>
            </a>
            <a href="/mr-pizza/pages/auth/login.html" class="mobile-menu__util" aria-label="Login">
              <i data-lucide="user-round" class="icon"></i>
              <span>LOGIN</span>
            </a>
          </div>

          <div class="mobile-menu__footer">
            <p class="mobile-tagline">MR.PIZZA</p>
            <p class="mobile-year">EST. 1990 · REIMAGINED 2026</p>
          </div>
        </div>
      </div>

      <main id="container" class="store-page">
        <section class="store" aria-labelledby="storeTitle">
          <div class="store__frame">
            <!-- LEFT VISUAL -->
            <aside class="store__visual" aria-hidden="true">
              <img src="../resources/images/component/store/store-visual.png" alt="" />
              <div class="store__visual-overlay"></div>
            </aside>

            <!-- RIGHT PANEL -->
            <div class="store__panel">
              <header class="store__head">
                <h2 class="store__title" id="storeTitle">STORE</h2>

                <div class="store__search">
                  <div class="store__search-box">
                    <input type="search" class="store__search-input" placeholder="매장명 또는 지역으로 검색" aria-label="매장 검색" />

                    <button type="button" class="store__search-clear" aria-label="검색어 삭제">
                      <span></span>
                      <span></span>
                    </button>
                  </div>
                  <p class="store__count" aria-live="polite"></p>
                </div>
              </header>

              <div class="store__body">
                <ul class="store__list" id="storeList" aria-label="매장 목록"></ul>

                <aside class="store-detail" id="storeDetail" aria-hidden="true" aria-labelledby="storeDetailName">
                  <button type="button" class="store-detail__close" id="storeDetailClose" aria-label="매장 상세 닫기">
                    <span></span>
                    <span></span>
                  </button>

                  <div class="store-detail__inner">
                    <figure class="store-detail__thumb">
                      <img id="storeDetailImage" src="" alt="" />
                    </figure>

                    <div class="store-detail__body">
                      <h3 class="store-detail__name" id="storeDetailName"></h3>
                      <p class="store-detail__address" id="storeDetailAddress"></p>
                      <p class="store-detail__phone" id="storeDetailPhone"></p>
                      <p class="store-detail__time" id="storeDetailTime"></p>

                      <a id="storeDetailMap" class="store-detail__map" href="#" target="_blank" rel="noopener noreferrer">
                        <span class="store-detail__map-text">View on Map</span>

                        <span class="store-detail__arrow" aria-hidden="true">
                          <i data-lucide="chevron-right"></i>
                          <i data-lucide="chevron-right"></i>
                        </span>
                      </a>
                    </div>
                  </div>
                </aside>
              </div>
            </div>
          </div>
        </section>
      </main>

      <footer id="footer" include-html="./layout/footer.html"></footer>
    </div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
