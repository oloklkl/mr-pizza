<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mr.Pizza | ABOUT</title>
    <meta name="description" content="미스터피자 리뉴얼 콘셉트 브랜드 스토리를 소개하는 페이지입니다." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://your-domain.com/pages/about.html" />
    <meta name="theme-color" content="#ff0033" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mr.Pizza" />
    <meta property="og:title" content="Mr.Pizza | ABOUT" />
    <meta property="og:description" content="미스터피자 리뉴얼 콘셉트의 브랜드 스토리와 비주얼 방향성을 소개하는 페이지입니다." />
    <meta property="og:image" content="https://your-domain.com/resources/images/component/common/meta.png" />
    <meta property="og:url" content="https://your-domain.com/pages/about.html" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mr.Pizza | ABOUT" />
    <meta name="twitter:description" content="미스터피자 리뉴얼 콘셉트의 브랜드 스토리와 비주얼 방향성을 소개하는 페이지입니다." />
    <meta name="twitter:image" content="https://your-domain.com/resources/images/component/common/meta.png" />

    <!-- favicon -->
    <link rel="icon" href="/resources/images/favicon/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/resources/images/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/resources/images/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/resources/images/favicon/apple-touch-icon.png" />

    <!-- Google Fonts: Montserrat / Playfair Display -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Playfair+Display:wght@600;700&display=swap" />

    <!-- Pretendard (Variable) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" />
    <link rel="stylesheet" href="../resources/css/pattern_css.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.1/gsap.min.js"></script>
    <script defer src="../resources/js/include.js"></script>
    <script defer src="../resources/js/ui-pattern.js"></script>
    <script defer src="../resources/js/about.js"></script>
  </head>
  <body>
    <div id="skip-nav">
      <a href="#gnb">메뉴 바로가기</a>
      <a href="#container">본문 바로가기</a>
    </div>
    <div id="wrap">
      <header id="header" include-html="./layout/header.html"></header>

      <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
        <div class="mobile-menu__content">
          <button class="mobile-menu__close" type="button" aria-label="Close menu">
            <span></span>
            <span></span>
          </button>

          <nav class="mobile-menu__nav">
            <ul>
              <li><a href="#">MENU</a></li>
              <li><a href="#">DROP</a></li>
              <li><a href="#">STORE</a></li>
              <li><a href="#">ABOUT</a></li>
            </ul>
          </nav>

          <div class="mobile-menu__utils" aria-label="Account and search">
            <a href="/pages/cart/cart.html" class="mobile-menu__util" aria-label="Cart">
              <i data-lucide="shopping-bag" class="icon"></i>
              <span>CART</span>
            </a>
            <a href="/pages/auth/login.html" class="mobile-menu__util" aria-label="Login">
              <i data-lucide="user-round" class="icon"></i>
              <span>LOGIN</span>
            </a>
          </div>

          <div class="mobile-menu__footer">
            <p class="mobile-tagline">MR.PIZZA</p>
            <p class="mobile-year">EST. 1990 · REIMAGINED 2026</p>
          </div>
        </div>
      </div>

      <main id="container" class="about">
        <!-- HERO -->
        <section class="about-hero" aria-labelledby="aboutHeroTitle">
          <div class="about-hero__bg">
            <img src="../resources/images/component/about/about-hero.png" alt="" />
          </div>

          <div class="about-hero__inner">
            <h1 id="aboutHeroTitle" class="about-hero__title">
              우리는 피자를 굽지 않는다.<br />
              공간을 만든다.
            </h1>
            <p class="about-hero__sub">MORE THAN PIZZA</p>

            <!-- 은근 네온 포인트 라인 -->
            <div class="about-hero__line" aria-hidden="true"></div>

            <!-- 다음 섹션으로 -->
            <a class="about-hero__scroll" href="#aboutValue" aria-label="Scroll to values">
              <span>SCROLL</span>
              <i data-lucide="chevron-down" class="icon"></i>
            </a>
          </div>
        </section>

        <!-- VALUES (HEAT / BALANCE / CRAFT) -->
        <section class="about-values" id="aboutValue" aria-label="Brand values">
          <div class="about-values__inner">
            <div class="about-values__grid">
              <article class="value-card" data-value="heat">
                <div class="value-card__media">
                  <img src="../resources/images/component/about/about-heat.png" alt="화덕의 불꽃" loading="lazy" />
                </div>
                <div class="value-card__body">
                  <h2 class="value-card__title">열</h2>
                  <p class="value-card__en">HEAT</p>
                  <p class="value-card__desc">
                    <!-- 멘트 너가 넣을 자리 -->
                  </p>
                </div>
              </article>

              <article class="value-card" data-value="balance">
                <div class="value-card__media">
                  <img src="../resources/images/component/about/about-balance.png" alt="반죽을 균형 있게 펴는 손" loading="lazy" />
                </div>
                <div class="value-card__body">
                  <h2 class="value-card__title">균형</h2>
                  <p class="value-card__en">BALANCE</p>
                  <p class="value-card__desc"></p>
                </div>
              </article>

              <article class="value-card" data-value="craft">
                <div class="value-card__media">
                  <img src="../resources/images/component/about/about-craft.png" alt="정교하게 마무리하는 손길" loading="lazy" />
                </div>
                <div class="value-card__body">
                  <h2 class="value-card__title">장인정신</h2>
                  <p class="value-card__en">CRAFT</p>
                  <p class="value-card__desc"></p>
                </div>
              </article>
            </div>
          </div>
        </section>

        <!-- ENDING -->
        <section class="about-end" aria-label="Closing statement">
          <div class="about-end__bg">
            <img src="../resources/images/component/about/about-oven.png" alt="" loading="lazy" />
            <span class="about-end__grain" aria-hidden="true"></span>
          </div>

          <div class="about-end__inner">
            <p class="about-end__quote">
              우리는 피자를 다시 정의한다.<br />
              열을 다루는 방식부터,<br />
              브랜드를 말하는 태도까지.
            </p>

            <p class="about-end__sub">MR.PIZZA 2026 — The Standard, Reimagined.</p>

            <div class="about-end__actions">
              <a class="btn-neon" href="../pages/menu.html">MENU 보기</a>
              <a class="btn-neon btn-neon--ghost" href="../pages/store.html">STORE 보기</a>
            </div>
          </div>
        </section>
      </main>

      <!-- <footer id="footer" include-html="./layout/footer.html"></footer> -->
    </div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
