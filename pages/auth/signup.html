          <h1 class="auth-card__title">회원가입</h1>

          <form class="auth-form" action="#" method="post" novalidate>
            <!-- 이메일 -->
            <div class="auth-field">
              <label class="sr-only" for="signupEmail">이메일</label>

              <div class="auth-control">
                <span class="auth-field__icon" aria-hidden="true">
                  <i data-lucide="mail"></i>
                </span>
                <input id="signupEmail" class="auth-field__input" name="email" type="email" inputmode="email" autocomplete="email" placeholder="example@mrpizza.com" required aria-describedby="signupEmailHelp" />
              </div>

              <p id="signupEmailHelp" class="auth-help">이메일 형식으로 입력해 주세요.</p>
            </div>

            <!-- 비밀번호 -->
            <div class="auth-field">
              <label class="sr-only" for="signupPassword">비밀번호</label>

              <div class="auth-control">
                <span class="auth-field__icon" aria-hidden="true">
                  <i data-lucide="lock"></i>
                </span>
                <input id="signupPassword" class="auth-field__input" name="password" type="password" autocomplete="new-password" placeholder="비밀번호 (영문/숫자/특수문자 조합)" required minlength="8" aria-describedby="signupPwHelp" />
              </div>

              <p id="signupPwHelp" class="auth-help">8자 이상 입력해 주세요.</p>
            </div>

            <!-- 비밀번호 확인 -->
            <div class="auth-field">
              <label class="sr-only" for="signupPasswordConfirm">비밀번호 확인</label>

              <div class="auth-control">
                <span class="auth-field__icon" aria-hidden="true">
                  <i data-lucide="check"></i>
                </span>
                <input id="signupPasswordConfirm" class="auth-field__input" name="passwordConfirm" type="password" autocomplete="new-password" placeholder="비밀번호 확인" required minlength="8" />
              </div>
            </div>

            <!-- 이름 -->
            <div class="auth-field">
              <label class="sr-only" for="signupName">이름</label>

              <div class="auth-control">
                <span class="auth-field__icon" aria-hidden="true">
                  <i data-lucide="user-round"></i>
                </span>
                <input id="signupName" class="auth-field__input" name="name" type="text" autocomplete="name" placeholder="이름" required />
              </div>
            </div>

            <!-- 휴대폰 -->
            <div class="auth-field">
              <label class="sr-only" for="signupPhone">휴대폰</label>

              <div class="auth-control">
                <span class="auth-field__icon" aria-hidden="true">
                  <i data-lucide="phone"></i>
                </span>
                <input id="signupPhone" class="auth-field__input" name="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="휴대폰 (010-0000-0000)" required />
              </div>
            </div>

            <!-- 약관 -->
            <div class="auth-check">
              <input id="agreeAll" class="auth-check__input" type="checkbox" required />
              <label class="auth-check__label" for="agreeAll"> 이용약관 및 개인정보 처리방침에 동의합니다 </label>
            </div>

            <p class="auth-form__message" data-signup-message aria-live="polite"></p>

            <button type="submit" class="auth-btn auth-btn--primary">회원가입</button>

            <p class="auth-foot">
              이미 계정이 있나요?
              <a class="auth-link" href="./login.html">로그인</a>
            </p>
          </form>
        </section>
